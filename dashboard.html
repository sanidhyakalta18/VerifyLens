<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VerifyLens</title><style>body{font:16px system-ui;background:#eef3f8;color:#172536;max-width:1100px;margin:40px auto;padding:20px}section{background:white;padding:24px;border-radius:14px;margin:20px 0}h1{font-size:36px}button{background:#164f80;color:white;border:0;padding:12px;border-radius:6px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap}small{color:#536477}</style><h1>VerifyLens</h1><p>Document extraction quality and API performance</p><small>Local demo • Fictional documents • Field validation does not establish identity authenticity</small><section><h2>Inspect a document</h2><input id="file" type="file" accept="image/png,image/jpeg"><select id="mode"><option value="raw">Grayscale</option><option value="threshold">Threshold preprocessing</option></select> <button id="run">Extract and validate</button><pre id="result">Choose a sample image from the samples folder.</pre></section><section><h2 id="metrics">Loading metrics</h2><div id="groups"></div></section><section><h2>Failure reasons</h2><div id="failures"></div></section><script>
function table(rows){if(!rows.length)return 'No results yet.';let t=document.createElement('table'),keys=Object.keys(rows[0]);let head=t.insertRow();keys.forEach(k=>{let c=document.createElement('th');c.textContent=k;head.append(c)});rows.forEach(r=>{let tr=t.insertRow();keys.forEach(k=>tr.insertCell().textContent=r[k]??'N/A')});return t}
async function refresh(){let d=await(await fetch('/api/analytics')).json();document.querySelector('#metrics').textContent=`${d.requests} requests · p95 ${d.p95_ms??'N/A'} ms`;for(let k of ['groups','failures'])document.getElementById(k).replaceChildren(table(d[k]))}
document.getElementById('run').onclick=async()=>{let b=document.getElementById('run'),f=document.getElementById('file').files[0];if(!f)return;b.disabled=true;try{let r=await fetch('/api/verify?mode='+document.getElementById('mode').value,{method:'POST',body:f});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2);await refresh()}catch(e){document.getElementById('result').textContent=String(e)}finally{b.disabled=false}};refresh();</script></html>
